<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Manage Hostels - MMUST Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="../css/style.css"/>
    <link rel="stylesheet" href="../css/dashboard.css"/>
    <link rel="stylesheet" href="../css/admin.css"/>
    <link rel="stylesheet" href="../css/tables.css"/>
    <link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="dashboard-body">
    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="fas fa-building-columns"></i> MMUST Admin</div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="students.html"><i class="fas fa-users"></i> Students</a></li>
                <li><a href="hostels.html" class="active"><i class="fas fa-building"></i> Hostels</a></li>
                <li><a href="bookings.html"><i class="fas fa-calendar-check"></i> Bookings</a></li>
                <li><a href="payments.html"><i class="fas fa-credit-card"></i> Payments</a></li>
                <li><a href="complaints.html"><i class="fas fa-exclamation-circle"></i> Complaints</a></li>
                <li><a href="maintenance.html"><i class="fas fa-tools"></i> Maintenance</a></li>
                <li><a href="announcements.html"><i class="fas fa-bullhorn"></i> Announcements</a></li>
                <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
            <div class="page-header"><h1>Manage Hostels</h1></div>
            <div class="card">
                <div class="table-container">
                    <table><thead><tr><th>ID</th><th>Name</th><th>Location</th><th>Price</th><th>Rooms</th><th>Action</th></tr></thead><tbody id="hostelsTable"></tbody></table>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await Auth.getCurrentUser();
            if (!user || user.role !== 'admin') { window.location.href = '../login.html'; return; }
            const hostels = await API.getHostels();
            const tbody = document.getElementById('hostelsTable');
            tbody.innerHTML = '';
            hostels.forEach(h => {
                tbody.innerHTML += `<tr><td>${h.id}</td><td>${h.name}</td><td>${h.location}</td><td>${h.price_per_semester}</td><td>${h.rooms_available}/${h.total_rooms}</td><td><button class="btn-sm btn-primary">Edit</button></td></tr>`;
            });
        });
    </script>
</body>
</html>
