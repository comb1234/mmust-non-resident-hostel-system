<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Maintenance - MMUST</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="../css/style.css"/>
    <link rel="stylesheet" href="../css/dashboard.css"/>
    <link rel="stylesheet" href="../css/student.css"/>
    <link rel="stylesheet" href="../css/forms.css"/>
    <link rel="stylesheet" href="../css/tables.css"/>
    <link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="dashboard-body">
    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="fas fa-building-columns"></i> MMUST Hostels</div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="profile.html"><i class="fas fa-user"></i> My Profile</a></li>
                <li><a href="hostels.html"><i class="fas fa-building"></i> Browse Hostels</a></li>
                <li><a href="bookings.html"><i class="fas fa-calendar-check"></i> My Bookings</a></li>
                <li><a href="payments.html"><i class="fas fa-credit-card"></i> Payments</a></li>
                <li><a href="complaints.html"><i class="fas fa-exclamation-circle"></i> Complaints</a></li>
                <li><a href="maintenance.html" class="active"><i class="fas fa-tools"></i> Maintenance</a></li>
                <li><a href="announcements.html"><i class="fas fa-bullhorn"></i> Announcements</a></li>
                <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
            <div class="page-header"><h1>Maintenance Requests</h1></div>

            <!-- Maintenance request form -->
            <div class="card">
                <div class="card-header"><span class="card-title">New Maintenance Request</span></div>
                <form id="maintenanceForm">
                    <div class="form-group"><label>Issue Type</label><input type="text" id="maintenanceIssue" placeholder="e.g., Plumbing, Electrical" required /></div>
                    <div class="form-group"><label>Description</label><textarea id="maintenanceDescription" required></textarea></div>
                    <button type="submit" class="btn-primary">Submit Request</button>
                </form>
                <div id="maintenanceMessage" class="error-message" style="display:none;"></div>
            </div>

            <!-- List of maintenance requests -->
            <div class="card">
                <div class="card-header"><span class="card-title">My Requests</span></div>
                <div class="table-container">
                    <table>
                        <thead><tr><th>ID</th><th>Issue</th><th>Status</th><th>Date</th></tr></thead>
                        <tbody id="maintenanceTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
        // Load maintenance requests and handle form
        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.isLoggedIn()) window.location.href = '../login.html';
            loadMaintenance();
        });

        // Fetch and display user's maintenance requests
        async function loadMaintenance() {
            try {
                const requests = await API.getMaintenance();
                const tbody = document.getElementById('maintenanceTable');
                if (requests.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No requests found.</td></tr>';
                } else {
                    requests.forEach(r => {
                        const statusClass = r.status === 'completed' ? 'badge-success' : r.status === 'pending' ? 'badge-warning' : 'badge-info';
                        tbody.innerHTML += `
                            <tr>
                                <td>${r.id}</td>
                                <td>${r.issue_type}</td>
                                <td><span class="badge ${statusClass}">${r.status}</span></td>
                                <td>${new Date(r.created_at).toLocaleDateString()}</td>
                            </tr>
                        `;
                    });
                }
            } catch (error) {
                console.error('Failed to load maintenance:', error);
            }
        }

        // Handle maintenance form submission
        document.getElementById('maintenanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const issue_type = document.getElementById('maintenanceIssue').value.trim();
            const description = document.getElementById('maintenanceDescription').value.trim();
            try {
                // Note: hostel is optional; backend model has it nullable
                await API.createMaintenance({ issue_type, description });
                document.getElementById('maintenanceForm').reset();
                document.getElementById('maintenanceMessage').style.display = 'none';
                alert('Maintenance request submitted!');
                loadMaintenance();
            } catch (error) {
                document.getElementById('maintenanceMessage').textContent = error.message;
                document.getElementById('maintenanceMessage').style.display = 'block';
            }
        });
    </script>
</body>
</html>
