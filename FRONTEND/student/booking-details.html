<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Booking Details - MMUST</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="../css/style.css"/>
    <link rel="stylesheet" href="../css/dashboard.css"/>
    <link rel="stylesheet" href="../css/student.css"/>
    <link rel="stylesheet" href="../css/tables.css"/>
    <link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="dashboard-body">
    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="fas fa-building-columns"></i> MMUST Hostels</div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="profile.html"><i class="fas fa-user"></i> My Profile</a></li>
                <li><a href="hostels.html"><i class="fas fa-building"></i> Browse Hostels</a></li>
                <li><a href="bookings.html" class="active"><i class="fas fa-calendar-check"></i> My Bookings</a></li>
                <li><a href="payments.html"><i class="fas fa-credit-card"></i> Payments</a></li>
                <li><a href="complaints.html"><i class="fas fa-exclamation-circle"></i> Complaints</a></li>
                <li><a href="maintenance.html"><i class="fas fa-tools"></i> Maintenance</a></li>
                <li><a href="announcements.html"><i class="fas fa-bullhorn"></i> Announcements</a></li>
                <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
            <div class="page-header"><h1>Booking Details</h1></div>
            <div id="bookingDetails"></div>
        </main>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
        // Fetch and display booking details
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const bookingId = urlParams.get('id');
            if (!bookingId) { window.location.href = 'bookings.html'; return; }
            try {
                const booking = await API.getBooking(bookingId);
                const detailsDiv = document.getElementById('bookingDetails');
                detailsDiv.innerHTML = `
                    <div class="card">
                        <h3>Booking ID: ${booking.id}</h3>
                        <p><strong>Hostel:</strong> ${booking.hostel_name || 'Unknown'}</p>
                        <p><strong>Status:</strong> <span class="badge ${booking.status === 'confirmed' ? 'badge-success' : booking.status === 'pending' ? 'badge-warning' : 'badge-danger'}">${booking.status}</span></p>
                        <p><strong>Semester:</strong> ${booking.semester || 'Not specified'}</p>
                        <p><strong>Created At:</strong> ${new Date(booking.created_at).toLocaleString()}</p>
                        ${booking.status === 'pending' ? `<button class="btn-danger" onclick="cancelBooking('${booking.id}')">Cancel Booking</button>` : ''}
                    </div>
                `;
            } catch (error) {
                document.getElementById('bookingDetails').innerHTML = `<div class="card">${error.message}</div>`;
            }
        });

        // Cancel a pending booking
        async function cancelBooking(id) {
            if (confirm('Are you sure you want to cancel this booking?')) {
                try {
                    await API.updateBooking(id, { status: 'cancelled' });
                    alert('Booking cancelled');
                    window.location.reload();
                } catch (error) {
                    alert('Failed to cancel: ' + error.message);
                }
            }
        }
    </script>
</body>
</html>
