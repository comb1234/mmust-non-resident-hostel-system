<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Hostel Details - MMUST</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="../css/style.css"/>
    <link rel="stylesheet" href="../css/dashboard.css"/>
    <link rel="stylesheet" href="../css/student.css"/>
    <link rel="stylesheet" href="../css/forms.css"/>
    <link rel="stylesheet" href="../css/responsive.css"/>
    <style>
        .image-gallery { display: flex; gap: 10px; flex-wrap: wrap; margin: 15px 0; }
        .image-gallery img { width: 150px; height: 100px; object-fit: cover; border-radius: 5px; cursor: pointer; }
        .main-image { width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body class="dashboard-body">
    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="fas fa-building-columns"></i> MMUST Hostels</div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="profile.html"><i class="fas fa-user"></i> My Profile</a></li>
                <li><a href="hostels.html" class="active"><i class="fas fa-building"></i> Browse Hostels</a></li>
                <li><a href="bookings.html"><i class="fas fa-calendar-check"></i> My Bookings</a></li>
                <li><a href="payments.html"><i class="fas fa-credit-card"></i> Payments</a></li>
                <li><a href="complaints.html"><i class="fas fa-exclamation-circle"></i> Complaints</a></li>
                <li><a href="maintenance.html"><i class="fas fa-tools"></i> Maintenance</a></li>
                <li><a href="announcements.html"><i class="fas fa-bullhorn"></i> Announcements</a></li>
                <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
            <div id="hostelDetails"></div>
        </main>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/hostels.js?v=4"></script>
    <script>
        // Fetch and display hostel details with image gallery
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const hostelId = urlParams.get('id');
            if (!hostelId) { window.location.href = 'hostels.html'; return; }
            try {
                let hostel;
                try{
                    hostel = await API.getHostel(hostelId);
                }catch(err){
                    // fallback to local sample hostels
                    const samples = (typeof FALLBACK_HOSTELS !== 'undefined') ? FALLBACK_HOSTELS : [];
                    hostel = samples.find(h => String(h.id) === String(hostelId)) || samples[0];
                    if(!hostel) throw err;
                }
                const images = hostel.images || [];
                const mainImage = resolveHostelImage(images.length > 0 ? images[0] : hostel.image);
                const detailsDiv = document.getElementById('hostelDetails');
                detailsDiv.innerHTML = `
                    <div class="card">
                        <img src="${mainImage}" class="main-image" id="mainImage" />
                        <div class="image-gallery" id="gallery">
                            ${images.map((img, i) => {
                                const imageUrl = resolveHostelImage(img);
                                return `<img src="${imageUrl}" onclick="document.getElementById('mainImage').src='${imageUrl}'" />`;
                            }).join('')}
                        </div>
                        <h1>${hostel.name}</h1>
                        <div class="hostel-meta">
                            <span><i class="fas fa-map-marker-alt"></i> ${hostel.location}</span>
                            <span><i class="fas fa-star"></i> ${hostel.rating} rating</span>
                            <span><i class="fas fa-venus-mars"></i> ${hostel.gender}</span>
                        </div>
                        <p>${hostel.description}</p>
                        <h3>Amenities</h3>
                        <ul>${hostel.amenities.map(a => `<li><i class="fas fa-check-circle" style="color:var(--success)"></i> ${a}</li>`).join('')}</ul>
                        <h3>Pricing</h3>
                        <p>KSh ${hostel.price_per_semester} per semester</p>
                        <p>Rooms available: ${hostel.rooms_available} / ${hostel.total_rooms}</p>
                        <button class="btn-primary btn-lg" onclick="bookHostel('${hostel.id}')">Book This Hostel</button>
                    </div>
                `;
            } catch (error) {
                document.getElementById('hostelDetails').innerHTML = `<div class="card">${error.message}</div>`;
            }
        });

        // Book the current hostel
        async function bookHostel(hostelId) {
            const user = await Auth.getCurrentUser();
            if (!user) { window.location.href = '../login.html'; return; }
            if (!user.phone) {
                alert('Add your registered phone number in your profile before booking.');
                return;
            }
            try {
                const booking = await API.createBooking({ hostel: hostelId, semester: '2025-2026' });
                const payment = await API.initiateStkPush(booking.id, user.phone);
                const approved = confirm(`${payment.message}\n\nPress OK to simulate entering your M-Pesa PIN, or Cancel to leave it pending.`);
                if (!approved) {
                    alert('Payment is still pending. You can retry it from the payment record.');
                    window.location.href = 'payments.html';
                    return;
                }
                const completed = await API.completeMockStkPayment(payment.payment.id);
                alert(`${completed.message}\nTransaction: ${completed.payment.transaction_id}`);
                window.location.href = 'bookings.html';
            } catch (error) {
                alert('Booking or payment failed: ' + error.message);
            }
        }
    </script>
</body>
</html>
