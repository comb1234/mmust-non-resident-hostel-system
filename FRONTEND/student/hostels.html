<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Browse Hostels - MMUST</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="../css/style.css"/>
    <link rel="stylesheet" href="../css/dashboard.css"/>
    <link rel="stylesheet" href="../css/student.css"/>
    <link rel="stylesheet" href="../css/forms.css"/>
    <link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="dashboard-body">
    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="fas fa-building-columns"></i> MMUST Hostels</div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="profile.html"><i class="fas fa-user"></i> My Profile</a></li>
                <li><a href="hostels.html" class="active"><i class="fas fa-building"></i> Browse Hostels</a></li>
                <li><a href="bookings.html"><i class="fas fa-calendar-check"></i> My Bookings</a></li>
                <li><a href="payments.html"><i class="fas fa-credit-card"></i> Payments</a></li>
                <li><a href="complaints.html"><i class="fas fa-exclamation-circle"></i> Complaints</a></li>
                <li><a href="maintenance.html"><i class="fas fa-tools"></i> Maintenance</a></li>
                <li><a href="announcements.html"><i class="fas fa-bullhorn"></i> Announcements</a></li>
                <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
            <div class="page-header"><h1>Available Hostels</h1></div>

            <!-- Filter card -->
            <div class="card">
                <div class="card-header"><span class="card-title">Filter Hostels</span></div>
                <div class="form-row" style="margin-bottom:20px;">
                    <div class="form-group"><label>Search by name</label><input type="text" id="searchInput" placeholder="Type hostel name..." /></div>
                    <div class="form-group"><label>Gender</label><select id="genderFilter"><option value="">All</option><option value="Male">Male</option><option value="Female">Female</option><option value="Mixed">Mixed</option></select></div>
                    <div class="form-group"><label>Max Price (KSh)</label><input type="number" id="maxPrice" placeholder="e.g. 20000" /></div>
                </div>
                <button class="btn-primary" onclick="filterHostels()"><i class="fas fa-filter"></i> Apply Filters</button>
            </div>

            <!-- Hostel grid -->
            <div id="hostelGrid" class="hostel-grid"></div>
        </main>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/hostels.js?v=4"></script>
    <script>
        // Load hostels on page ready
        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.isLoggedIn()) {
                window.location.href = '../login.html';
                return;
            }
            const hostels = await fetchHostelsWithFallback();
            displayHostels('hostelGrid', hostels);
        });

        // Filter hostels based on user input
        async function filterHostels() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const gender = document.getElementById('genderFilter').value;
            const maxPrice = document.getElementById('maxPrice').value;
            let params = '?';
            if (search) params += `search=${encodeURIComponent(search)}&`;
            if (gender) params += `gender=${encodeURIComponent(gender)}&`;
            if (maxPrice) params += `price_per_semester__lte=${maxPrice}`;
            const hostels = await fetchHostelsWithFallback(params);
            displayHostels('hostelGrid', hostels);
        }
    </script>
</body>
</html>
