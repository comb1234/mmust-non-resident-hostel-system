<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Profile - MMUST Hostels</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="../css/style.css"/>
    <link rel="stylesheet" href="../css/dashboard.css"/>
    <link rel="stylesheet" href="../css/student.css"/>
    <link rel="stylesheet" href="../css/forms.css"/>
    <link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="dashboard-body">
    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="fas fa-building-columns"></i> MMUST Hostels</div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="profile.html" class="active"><i class="fas fa-user"></i> My Profile</a></li>
                <li><a href="hostels.html"><i class="fas fa-building"></i> Browse Hostels</a></li>
                <li><a href="bookings.html"><i class="fas fa-calendar-check"></i> My Bookings</a></li>
                <li><a href="payments.html"><i class="fas fa-credit-card"></i> Payments</a></li>
                <li><a href="complaints.html"><i class="fas fa-exclamation-circle"></i> Complaints</a></li>
                <li><a href="maintenance.html"><i class="fas fa-tools"></i> Maintenance</a></li>
                <li><a href="announcements.html"><i class="fas fa-bullhorn"></i> Announcements</a></li>
                <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
            <div class="page-header"><h1>My Profile</h1></div>
            <div class="card">
                <form id="profileForm">
                    <div class="form-row">
                        <div class="form-group"><label>First Name</label><input type="text" id="profileFirstName" required /></div>
                        <div class="form-group"><label>Last Name</label><input type="text" id="profileLastName" required /></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Email</label><input type="email" id="profileEmail" disabled /></div>
                        <div class="form-group"><label>Registration Number</label><input type="text" id="profileRegNumber" /></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Phone</label><input type="tel" id="profilePhone" /></div>
                        <div class="form-group"><label>Course</label><input type="text" id="profileCourse" /></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Gender</label><select id="profileGender"><option value="">Select</option><option value="Male">Male</option><option value="Female">Female</option></select></div>
                        <div class="form-group"><label>Year of Study</label><select id="profileYear"><option value="">Select</option><option value="1">Year 1</option><option value="2">Year 2</option><option value="3">Year 3</option><option value="4">Year 4</option></select></div>
                    </div>
                    <button type="submit" class="btn-primary">Update Profile</button>
                </form>
                <div id="profileMessage" class="error-message" style="display:none;"></div>
            </div>
        </main>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
        // Load current user data into form
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await Auth.getCurrentUser();
            if (!user) { window.location.href = '../login.html'; return; }
            document.getElementById('profileFirstName').value = user.first_name || '';
            document.getElementById('profileLastName').value = user.last_name || '';
            document.getElementById('profileEmail').value = user.email || '';
            document.getElementById('profileRegNumber').value = user.registration_number || '';
            document.getElementById('profilePhone').value = user.phone || '';
            document.getElementById('profileCourse').value = user.course || '';
            document.getElementById('profileGender').value = user.gender || '';
            document.getElementById('profileYear').value = user.year_of_study || '';
        });

        // Handle profile update
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                first_name: document.getElementById('profileFirstName').value.trim(),
                last_name: document.getElementById('profileLastName').value.trim(),
                registration_number: document.getElementById('profileRegNumber').value.trim(),
                phone: document.getElementById('profilePhone').value.trim(),
                course: document.getElementById('profileCourse').value.trim(),
                gender: document.getElementById('profileGender').value,
                year_of_study: document.getElementById('profileYear').value,
            };
            try {
                await API.updateProfile(data);
                alert('Profile updated successfully!');
            } catch (error) {
                document.getElementById('profileMessage').textContent = error.message;
                document.getElementById('profileMessage').style.display = 'block';
            }
        });
    </script>
</body>
</html>
