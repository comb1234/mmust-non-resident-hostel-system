<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Complaints - MMUST</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="../css/style.css"/>
    <link rel="stylesheet" href="../css/dashboard.css"/>
    <link rel="stylesheet" href="../css/student.css"/>
    <link rel="stylesheet" href="../css/forms.css"/>
    <link rel="stylesheet" href="../css/tables.css"/>
    <link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="dashboard-body">
    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="fas fa-building-columns"></i> MMUST Hostels</div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="profile.html"><i class="fas fa-user"></i> My Profile</a></li>
                <li><a href="hostels.html"><i class="fas fa-building"></i> Browse Hostels</a></li>
                <li><a href="bookings.html"><i class="fas fa-calendar-check"></i> My Bookings</a></li>
                <li><a href="payments.html"><i class="fas fa-credit-card"></i> Payments</a></li>
                <li><a href="complaints.html" class="active"><i class="fas fa-exclamation-circle"></i> Complaints</a></li>
                <li><a href="maintenance.html"><i class="fas fa-tools"></i> Maintenance</a></li>
                <li><a href="announcements.html"><i class="fas fa-bullhorn"></i> Announcements</a></li>
                <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
            <div class="page-header"><h1>My Complaints</h1></div>

            <!-- Complaint submission form -->
            <div class="card">
                <div class="card-header"><span class="card-title">Submit New Complaint</span></div>
                <form id="complaintForm">
                    <div class="form-group"><label>Subject</label><input type="text" id="complaintSubject" required /></div>
                    <div class="form-group"><label>Description</label><textarea id="complaintDescription" required></textarea></div>
                    <button type="submit" class="btn-primary">Submit Complaint</button>
                </form>
                <div id="complaintMessage" class="error-message" style="display:none;"></div>
            </div>

            <!-- List of complaints -->
            <div class="card">
                <div class="card-header"><span class="card-title">My Complaints</span></div>
                <div class="table-container">
                    <table>
                        <thead><tr><th>ID</th><th>Subject</th><th>Status</th><th>Date</th></tr></thead>
                        <tbody id="complaintsTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
        // Load complaints and handle form submission
        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.isLoggedIn()) window.location.href = '../login.html';
            loadComplaints();
        });

        // Fetch and display user's complaints
        async function loadComplaints() {
            try {
                const complaints = await API.getComplaints();
                const tbody = document.getElementById('complaintsTable');
                if (complaints.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No complaints found.</td></tr>';
                } else {
                    complaints.forEach(c => {
                        const statusClass = c.status === 'open' ? 'badge-warning' : c.status === 'resolved' ? 'badge-success' : 'badge-info';
                        tbody.innerHTML += `
                            <tr>
                                <td>${c.id}</td>
                                <td>${c.subject}</td>
                                <td><span class="badge ${statusClass}">${c.status}</span></td>
                                <td>${new Date(c.created_at).toLocaleDateString()}</td>
                            </tr>
                        `;
                    });
                }
            } catch (error) {
                console.error('Failed to load complaints:', error);
            }
        }

        // Handle complaint form submission
        document.getElementById('complaintForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const subject = document.getElementById('complaintSubject').value.trim();
            const description = document.getElementById('complaintDescription').value.trim();
            try {
                await API.createComplaint({ subject, description });
                document.getElementById('complaintForm').reset();
                document.getElementById('complaintMessage').style.display = 'none';
                alert('Complaint submitted successfully!');
                loadComplaints();
            } catch (error) {
                document.getElementById('complaintMessage').textContent = error.message;
                document.getElementById('complaintMessage').style.display = 'block';
            }
        });
    </script>
</body>
</html>
