<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Payments - MMUST</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="../css/style.css"/>
    <link rel="stylesheet" href="../css/dashboard.css"/>
    <link rel="stylesheet" href="../css/student.css"/>
    <link rel="stylesheet" href="../css/tables.css"/>
    <link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="dashboard-body">
    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="fas fa-building-columns"></i> MMUST Hostels</div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="profile.html"><i class="fas fa-user"></i> My Profile</a></li>
                <li><a href="hostels.html"><i class="fas fa-building"></i> Browse Hostels</a></li>
                <li><a href="bookings.html"><i class="fas fa-calendar-check"></i> My Bookings</a></li>
                <li><a href="payments.html" class="active"><i class="fas fa-credit-card"></i> Payments</a></li>
                <li><a href="complaints.html"><i class="fas fa-exclamation-circle"></i> Complaints</a></li>
                <li><a href="maintenance.html"><i class="fas fa-tools"></i> Maintenance</a></li>
                <li><a href="announcements.html"><i class="fas fa-bullhorn"></i> Announcements</a></li>
                <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
            <div class="page-header"><h1>My Payments</h1></div>
            <div class="card">
                <div class="table-container">
                    <table>
                        <thead><tr><th>Payment ID</th><th>Booking</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
                        <tbody id="paymentsTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
        // Load user's payments
        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.isLoggedIn()) { window.location.href = '../login.html'; return; }
            try {
                const payments = await API.getPayments();
                const tbody = document.getElementById('paymentsTable');
                if (payments.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No payments found.</td></tr>';
                } else {
                    payments.forEach(p => {
                        const statusClass = p.status === 'completed' ? 'badge-success' : p.status === 'pending' ? 'badge-warning' : 'badge-danger';
                        tbody.innerHTML += `
                            <tr>
                                <td>${p.id}</td>
                                <td>${p.booking_details || 'Unknown'}</td>
                                <td>KSh ${p.amount}</td>
                                <td><span class="badge ${statusClass}">${p.status}</span></td>
                                <td>${new Date(p.created_at).toLocaleDateString()}</td>
                            </tr>
                        `;
                    });
                }
            } catch (error) {
                console.error('Failed to load payments:', error);
            }
        });
    </script>
</body>
</html>
