<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register - MMUST Hostels</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="css/style.css"/>
    <link rel="stylesheet" href="css/auth.css"/>
    <link rel="stylesheet" href="css/forms.css"/>
    <link rel="stylesheet" href="css/responsive.css"/>
</head>
<body class="auth-body">
    <div class="auth-container wide">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-back"><i class="fas fa-arrow-left"></i> Back to Home</a>
                <div class="auth-logo"><i class="fas fa-building-columns"></i><h1>MMUST Hostels</h1></div>
                <h2>Create Your Account</h2>
                <p>Register as a non-resident student</p>
            </div>
            <form id="registerForm" class="auth-form">
                <div class="form-row">
                    <div class="form-group"><label>Full Name</label><input type="text" id="regFullName" required /></div>
                    <div class="form-group"><label>Registration Number</label><input type="text" id="regRegNumber" required /></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Email</label><input type="email" id="regEmail" required /></div>
                    <div class="form-group"><label>Phone</label><input type="tel" id="regPhone" required /></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Gender</label><select id="regGender"><option value="">Select</option><option value="Male">Male</option><option value="Female">Female</option></select></div>
                    <div class="form-group"><label>Course</label><input type="text" id="regCourse" required /></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Year of Study</label><select id="regYear" required><option value="">Select</option><option value="1">Year 1</option><option value="2">Year 2</option><option value="3">Year 3</option><option value="4">Year 4</option></select></div>
                    <div class="form-group"><label>Password</label><input type="password" id="regPassword" name="password" autocomplete="new-password" required /></div>
                </div>
                <div class="form-group"><label for="regPassword2">Confirm Password</label><input type="password" id="regPassword2" name="password2" autocomplete="new-password" required /></div>
                <div id="registerError" class="error-message" style="display:none;"></div>
                <button type="submit" class="btn-primary btn-block btn-lg"><i class="fas fa-user-plus"></i> Register</button>
            </form>
            <div class="auth-footer"><p>Already have an account? <a href="login.html">Login here</a></p></div>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Handle registration form submission
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const password2 = document.getElementById('regPassword2').value;
            const error = document.getElementById('registerError');
            if (password !== password2) {
                error.textContent = 'Passwords do not match.';
                error.style.display = 'block';
                return;
            }
            // Validate student email
            if (!email.endsWith('@student.mmust.ac.ke')) {
                error.textContent = 'Only MMUST student emails are allowed.';
                error.style.display = 'block';
                return;
            }
            const formData = {
                fullName: document.getElementById('regFullName').value.trim(),
                regNumber: document.getElementById('regRegNumber').value.trim(),
                email: email,
                phone: document.getElementById('regPhone').value.trim(),
                gender: document.getElementById('regGender').value,
                course: document.getElementById('regCourse').value.trim(),
                year: document.getElementById('regYear').value,
                password,
                password2,
            };
            const result = await Auth.register(formData);
            if (result.success) {
                window.location.href = 'student/dashboard.html';
            } else {
                document.getElementById('registerError').textContent = result.message;
                document.getElementById('registerError').style.display = 'block';
            }
        });
    </script>
</body>
</html>
